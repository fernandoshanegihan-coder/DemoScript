<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Video with narration — export check</title>
<style>body{font:16px/1.5 system-ui;max-width:820px;margin:32px auto;padding:0 20px;color:#17352b;background:#f7f5ef}button,a{padding:12px 16px}video{display:block;width:480px;max-width:100%;margin-top:20px}pre{white-space:pre-wrap}a{display:inline-block}</style>
<h1>Video with narration: browser check</h1>
<p>This test uses a four-second generated picture and two synthetic voice tones. It does not use personal recordings, a microphone or Gemini.</p>
<button id="run">Run combined-video check</button><pre id="report" role="status">Ready.</pre><div id="result"></div>
<script type="module">
// TEST_MODULES
const run = document.querySelector('#run'); const report = document.querySelector('#report');
const assert = (condition, message) => { if (!condition) throw new Error(message); };
run.onclick = async () => {
  run.disabled = true; report.textContent = 'Generating synthetic footage…';
  let context, stream;
  try {
    const canvas = document.createElement('canvas'); canvas.width = 320; canvas.height = 180;
    const draw = canvas.getContext('2d'); let alternate = false;
    const paint = () => { draw.fillStyle = alternate ? '#385473' : '#225b42'; draw.fillRect(0, 0, 320, 180); draw.fillStyle = 'white'; draw.font = '20px system-ui'; draw.fillText(alternate ? 'Second scene' : 'First scene', 30, 90); };
    paint(); context = new AudioContext({ sampleRate: 48000 }); await context.resume();
    const destination = context.createMediaStreamDestination(); const oscillator = context.createOscillator();
    oscillator.frequency.value = 180; const gain = context.createGain(); gain.gain.value = .2; oscillator.connect(gain).connect(destination); oscillator.start();
    stream = new MediaStream([...canvas.captureStream(20).getVideoTracks(), ...destination.stream.getAudioTracks()]);
    const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/mp4'].find(type => MediaRecorder.isTypeSupported(type));
    assert(mime, 'No recording codec for the synthetic test');
    const recorder = new MediaRecorder(stream, { mimeType: mime }); const chunks = [];
    recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
    const stopped = new Promise(resolve => recorder.onstop = resolve);
    recorder.start(100); const timer = setInterval(paint, 50);
    await new Promise(resolve => setTimeout(resolve, 2000)); alternate = true;
    await new Promise(resolve => setTimeout(resolve, 2000)); recorder.stop(); await stopped;
    clearInterval(timer); oscillator.stop(); stream.getTracks().forEach(track => track.stop()); await context.close(); context = null;
    const original = new Blob(chunks, { type: recorder.mimeType });
    const scenes = [0, 2].map((startSeconds, index) => ({ id: `scene-${index}`, startSeconds, seconds: 2, spokenLine: `Spoken line ${index}`, caption: 'Test scene', description: '', covers: [] }));
    const takes = new Map(scenes.map((scene, index) => {
      const samples = new Float32Array(24000);
      for (let i = 0; i < samples.length; i++) samples[i] = .25 * Math.sin(2 * Math.PI * (index ? 880 : 440) * i / 48000);
      return [scene.id, { blob: encodeWav(samples), spokenLine: scene.spokenLine, durationSeconds: .5, source: 'voice', status: 'too-short', wpm: 120, wpmOutOfRange: false }];
    }));
    const narration = await buildNarration(scenes, takes, 4);
    report.textContent = 'Combining video and narration…';
    const combined = await combineVideoAndNarration(original, narration, 4, { onProgress: value => report.textContent = `Combining: ${Math.round(value * 100)}%` });
    const check = new Input({ source: new BlobSource(combined.blob), formats: ALL_FORMATS });
    const audioTracks = await check.getAudioTracks(); const videoTrack = await check.getPrimaryVideoTrack();
    assert(videoTrack && audioTracks.length === 1, 'Export must contain a video track and exactly one narration track');
    const duration = await check.computeDuration(); assert(Math.abs(duration - 4) < .15, `Unexpected export duration: ${duration}`);
    const ranges = [[.1, .4], [1, 1.5], [2.1, 2.4]]; const squares = [0, 0, 0], counts = [0, 0, 0];
    for await (const sample of new AudioBufferSink(audioTracks[0]).buffers()) {
      const data = sample.buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        const time = sample.timestamp + i / sample.buffer.sampleRate;
        for (let bucket = 0; bucket < ranges.length; bucket++) if (time >= ranges[bucket][0] && time < ranges[bucket][1]) { squares[bucket] += data[i] ** 2; counts[bucket]++; }
      }
    }
    const rms = squares.map((sum, index) => Math.sqrt(sum / Math.max(1, counts[index])));
    assert(rms[0] > .05 && rms[2] > .05, `Narration is not audible at its scene timestamps: ${rms}`);
    assert(rms[1] < .003, `The gap must stay silent, including removal of original audio: ${rms[1]}`);
    const codecs = { video: await videoTrack.getCodec(), audio: await audioTracks[0].getCodec() }; check.dispose();
    const controller = new AbortController(); let cancelled = false;
    try { await combineVideoAndNarration(original, narration, 4, { signal: controller.signal, onProgress: () => controller.abort() }); }
    catch { cancelled = controller.signal.aborted; }
    assert(cancelled, 'Cancelling an active export must stop it without producing a download');
    const url = URL.createObjectURL(combined.blob);
    const player = document.createElement('video'); player.src = url; player.controls = true;
    const link = document.createElement('a'); link.href = url; link.download = `verified-demo-with-narration.${combined.extension}`; link.textContent = 'Download verified video with narration';
    document.querySelector('#result').replaceChildren(player, link);
    report.textContent = JSON.stringify({ passed: true, duration, codecs, narrationRms: [rms[0], rms[2]], silentGapRms: rms[1], cancellationPassed: cancelled, bytes: combined.blob.size, extension: combined.extension }, null, 2);
  } catch (error) { report.textContent = `FAIL: ${error.stack || error.message}`; console.error(error); }
  finally { stream?.getTracks().forEach(track => track.stop()); await context?.close(); run.disabled = false; }
};
</script></html>
